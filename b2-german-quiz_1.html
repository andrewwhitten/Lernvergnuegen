<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B2 German Quick Test</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Karla:wght@300;400;500;700&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0d0d;--surface:#161616;--card:#1e1e1e;--border:#2a2a2a;--accent:#e8c547;--accent2:#4fc3a1;--danger:#e05c5c;--text:#e8e4dc;--muted:#666;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:Karla,sans-serif;font-weight:300;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem;}
.app{width:100%;max-width:620px;}
.screen{display:none;}.screen.active{display:block;}
.badge{font-family:"IBM Plex Mono",monospace;font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);display:inline-block;padding:.25rem .6rem;margin-bottom:1.5rem;}
h1{font-family:"Bebas Neue",sans-serif;font-size:clamp(4rem,12vw,7rem);line-height:.9;margin-bottom:1.5rem;}
h1 span{color:var(--accent);}
.desc{font-size:.9rem;color:#aaa;line-height:1.6;margin-bottom:2rem;}
.tags{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:2.5rem;}
.tag{font-family:"IBM Plex Mono",monospace;font-size:.62rem;padding:.3rem .7rem;border:1px solid var(--border);color:var(--muted);}
.tag.hi{border-color:var(--accent);color:var(--accent);}
.btn-p{background:var(--accent);color:#000;border:none;padding:1rem 2.5rem;font-family:"Bebas Neue",sans-serif;font-size:1.3rem;letter-spacing:.1em;cursor:pointer;}
.btn-p:hover{background:#f5d45a;}
.qhdr{display:flex;align-items:center;gap:1rem;margin-bottom:2rem;}
.ptrack{flex:1;height:3px;background:var(--border);}
.pfill{height:100%;background:var(--accent);transition:width .4s;}
.qcnt{font-family:"IBM Plex Mono",monospace;font-size:.65rem;color:var(--muted);white-space:nowrap;}
.cbadge{font-family:"IBM Plex Mono",monospace;font-size:.58rem;text-transform:uppercase;letter-spacing:.15em;padding:.2rem .5rem;border:1px solid var(--accent2);color:var(--accent2);margin-bottom:1.25rem;display:inline-block;}
.qtext{font-size:1rem;line-height:1.65;margin-bottom:.75rem;font-weight:400;white-space:pre-wrap;}
.qctx{font-size:.8rem;color:var(--muted);font-style:italic;margin-bottom:1.5rem;line-height:1.5;}
.opts{display:grid;gap:.6rem;margin-bottom:1.5rem;}
.opt{background:var(--card);border:1px solid var(--border);color:var(--text);padding:.9rem 1.25rem;text-align:left;cursor:pointer;font-family:Karla,sans-serif;font-size:.9rem;transition:border-color .15s,background .15s;display:flex;align-items:flex-start;gap:.75rem;line-height:1.5;width:100%;}
.opt:hover{border-color:var(--accent);background:#252520;}
.opt-l{font-family:"IBM Plex Mono",monospace;font-size:.65rem;color:var(--muted);min-width:1rem;padding-top:.15rem;flex-shrink:0;}
.opt.correct{border-color:var(--accent2);background:rgba(79,195,161,.1);}
.opt.correct .opt-l{color:var(--accent2);}
.opt.wrong{border-color:var(--danger);background:rgba(224,92,92,.1);}
.opt.wrong .opt-l{color:var(--danger);}
.expl{background:var(--surface);border-left:3px solid var(--accent);padding:1rem 1.25rem;font-size:.83rem;line-height:1.6;color:#bbb;margin-bottom:1.5rem;display:none;}
.expl.show{display:block;}
.expl strong{color:var(--text);}
.btn-n{background:transparent;border:1px solid var(--accent);color:var(--accent);padding:.75rem 2rem;font-family:"IBM Plex Mono",monospace;font-size:.7rem;letter-spacing:.15em;text-transform:uppercase;cursor:pointer;display:none;}
.btn-n.show{display:inline-block;}
.btn-n:hover{background:var(--accent);color:#000;}
.sc-lbl{font-family:"IBM Plex Mono",monospace;font-size:.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:.15em;}
.sc-big{font-family:"Bebas Neue",sans-serif;font-size:6rem;line-height:1;color:var(--accent);margin:.5rem 0;}
.vdict{font-size:1.1rem;font-weight:500;margin:1rem 0 .5rem;}
.vdesc{font-size:.85rem;color:#aaa;line-height:1.6;max-width:420px;}
.csg{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin:1.5rem 0;}
.csi{background:var(--surface);border:1px solid var(--border);padding:.75rem 1rem;}
.csi-n{font-family:"IBM Plex Mono",monospace;font-size:.6rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:.3rem;}
.csi-v{font-family:"Bebas Neue",sans-serif;font-size:1.6rem;}
.csi-v.p{color:var(--accent2);}.csi-v.f{color:var(--danger);}
.bdn{border:1px solid var(--border);margin:2rem 0;}
.bdn-t{font-family:"IBM Plex Mono",monospace;font-size:.6rem;text-transform:uppercase;letter-spacing:.15em;color:var(--muted);padding:.75rem 1rem;border-bottom:1px solid var(--border);background:var(--surface);}
.brow{display:flex;align-items:center;padding:.75rem 1rem;border-bottom:1px solid var(--border);gap:1rem;}
.brow:last-child{border-bottom:none;}
.bc{font-family:"IBM Plex Mono",monospace;font-size:.62rem;color:var(--muted);min-width:110px;}
.bq{flex:1;color:#bbb;font-size:.8rem;}
.br{font-family:"IBM Plex Mono",monospace;font-size:.7rem;padding:.15rem .5rem;}
.br.ok{background:rgba(79,195,161,.15);color:var(--accent2);}
.br.no{background:rgba(224,92,92,.15);color:var(--danger);}
@keyframes fi{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
.fi{animation:fi .35s ease;}
</style>
</head>
<body>
<div class="app">
  <div class="screen active" id="s-intro">
    <div class="fi">
      <div class="badge">Goethe B2 - Quick Assessment</div>
      <h1>TEST<br><span>DEIN B2</span></h1>
      <p class="desc">15 B2-level questions across 5 skill areas. About 8 minutes. Instant results with explanations.</p>
      <div class="tags">
        <span class="tag hi">Horen</span>
        <span class="tag">Grammatik</span>
        <span class="tag">Wortschatz</span>
        <span class="tag">Leseverstehen</span>
        <span class="tag">Redemittel</span>
      </div>
      <button class="btn-p" id="startBtn">START TEST</button>
    </div>
  </div>
  <div class="screen" id="s-quiz">
    <div class="qhdr">
      <div class="ptrack"><div class="pfill" id="pfill"></div></div>
      <div class="qcnt" id="qcnt">1 / 15</div>
    </div>
    <div id="qarea"></div>
  </div>
  <div class="screen" id="s-results">
    <div class="fi">
      <div class="sc-lbl">Your Score</div>
      <div class="sc-big" id="scbig"></div>
      <div class="vdict" id="vtext"></div>
      <div class="vdesc" id="vdesc"></div>
      <div class="csg" id="csg"></div>
      <div class="bdn" id="bdn"></div>
      <button class="btn-p" id="retryBtn">TRY AGAIN</button>
    </div>
  </div>
</div>
<script>
var QS = [
  {
    cat:'Grammatik',
    q:'W\u00E4hlen Sie die richtige Form:\n\n\u201EEr behauptete, er _____ das Dokument nie gesehen _____."',
    ctx:'Indirekte Rede in einem formellen Kontext.',
    opts:['habe / haben','h\u00E4tte / haben','hat / gehabt','habe / gehabt'],
    ans:3,
    expl:'Indirect speech (indirekte Rede) in formal German uses Konjunktiv I: \'habe ... gehabt\' = Konjunktiv I Perfekt of \'sehen\'. Konjunktiv II \'h\u00E4tte gehabt\' would imply a hypothetical, not reported speech.'
  },
  {
    cat:'Grammatik',
    q:'Welcher Satz enth\u00E4lt einen Grammatikfehler?',
    ctx:null,
    opts:['Wegen des schlechten Wetters blieben wir zu Hause.','Trotz des Regens gingen wir spazieren.','W\u00E4hrend dem Essen sprachen wir \u00FCber Arbeit.','Aufgrund der Versp\u00E4tung verpassten wir den Anschluss.'],
    ans:2,
    expl:'\'W\u00E4hrend\' always takes the GENITIVE in standard written German: \'w\u00E4hrend des Essens\'. \'W\u00E4hrend dem\' (Dative) is a common spoken error but wrong at B2 level.'
  },
  {
    cat:'Grammatik',
    q:'Welche Form ist korrekt?\n\n"Die Ergebnisse _____ n\u00E4chste Woche bekannt _____."',
    ctx:'Formeller Bericht.',
    opts:['werden / gegeben werden','sollen / gegeben werden','werden / gegeben','sind / gegeben worden'],
    ans:2,
    expl:'\'Werden bekannt gegeben\' is correct Vorgangspassiv: werden + Partizip II. Option D (Perfekt Passiv) refers to something already completed.'
  },
  {
    cat:'Wortschatz',
    q:'Was bedeutet "etwas in Kauf nehmen"?',
    ctx:null,
    opts:['Etwas g\u00FCnstig kaufen','Einen Nachteil bewusst akzeptieren','Etwas zur\u00FCckgeben','Einen Kompromiss anbieten'],
    ans:1,
    expl:'\'Etwas in Kauf nehmen\' means to accept something negative as a trade-off. Example: \'Fuer den Job nimmt sie lange Pendelzeiten in Kauf.\' Nothing to do with shopping.'
  },
  {
    cat:'Wortschatz',
    q:'Welches Adjektiv beschreibt jemanden, der sehr wenig redet?',
    ctx:null,
    opts:['gespr\u00E4chig','aufgeschlossen','wortkarg','redselig'],
    ans:2,
    expl:'\'Wortkarg\' = laconic/tight-lipped. \'Gespr\u00E4chig\' and \'redselig\' both mean talkative (the opposite). \'Aufgeschlossen\' = open-minded.'
  },
  {
    cat:'Wortschatz',
    q:'Welches Wort passt am besten?\n\n"Ihre _____ f\u00FCr das Fach Biologie war schon als Kind erkennbar."',
    ctx:null,
    opts:['Neugier','Begabung','Begeisterung','Leidenschaft'],
    ans:1,
    expl:'\'Begabung\' (talent/gift) fits best -- it refers to an innate ability recognisable from an early age. The other words describe emotions or curiosity, not natural talent.'
  },
  {
    cat:'H\u00F6ren',
    q:'Sie h\u00F6ren einen Vortrag:\n\n"Die Zahl der Menschen in Gro\u00DFst\u00E4dten steigt rasant. Experten warnen: Ohne massive Investitionen in den sozialen Wohnungsbau wird die Wohnungsnot zunehmen. Zudem betonen Stadtplaner, dass Gentrifizierung bestehende Gemeinschaften zerst\u00F6ren kann."\n\nWelche zwei Probleme werden genannt?',
    ctx:'H\u00F6ren-Simulation: Lesen Sie die Frage zuerst.',
    opts:['Bev\u00F6lkerungsr\u00FCckgang und Arbeitslosigkeit','Wohnungsmangel und Gentrifizierung','Umweltverschmutzung und Verkehr','Mangelnde Schulen und Krankenh\u00E4user'],
    ans:1,
    expl:'Two problems are named: (1) Wohnungsnot (housing shortage) and (2) Gentrifizierung destroying communities. A global listening task -- identifying multiple main points.'
  },
  {
    cat:'H\u00F6ren',
    q:'Podcast-Diskussion \u00FCber KI:\n\nExpertin A: "KI wird Routinejobs ersetzen, aber neue kreative Jobs entstehen lassen."\nExperte B: "Da bin ich skeptisch. Die neuen Jobs werden viele nicht erreichen -- sie erfordern zu hohe Qualifikationen."\n\nWor\u00FCber ist Experte B skeptisch?',
    ctx:'H\u00F6ren-Simulation: Achten Sie auf die Nuance.',
    opts:['Er glaubt nicht, dass KI Jobs ersetzen wird.','Er bezweifelt, dass neue Jobs f\u00FCr alle zug\u00E4nglich sein werden.','Er denkt, KI schafft gar keine neuen Berufe.','Er lehnt KI grunds\u00E4tzlich ab.'],
    ans:1,
    expl:'Experte B does not deny new jobs will emerge -- he questions their accessibility. Identifying the precise object of scepticism is a key B2 H\u00F6ren skill.'
  },
  {
    cat:'H\u00F6ren',
    q:'Radiobericht:\n\n"Nach monatelangen Tarifverhandlungen einigten sich beide Seiten: L\u00F6hne steigen um 4,5 Prozent -- allerdings erst nach einer Nullrunde von sechs Monaten. Die Gewerkschaft nannte das Ergebnis akzeptabel, wenn auch nicht zufriedenstellend."\n\nWie bewertet die Gewerkschaft das Ergebnis?',
    ctx:'H\u00F6ren-Simulation.',
    opts:['Vollkommen zufrieden','Ablehnend -- sie werden weiterk\u00E4mpfen','Bedingt positiv -- akzeptabel, aber nicht ideal','Sie hat keine Meinung ge\u00E4u\u00DFert'],
    ans:2,
    expl:'\'Akzeptabel, wenn auch nicht zufriedenstellend\' = acceptable but not satisfying -- a qualified, lukewarm positive. Recognising nuanced attitude language is crucial in B2 H\u00F6ren.'
  },
  {
    cat:'Leseverstehen',
    q:'Lesen Sie:\n\n"Fernarbeit verbessert die Work-Life-Balance vieler Besch\u00E4ftigter, birgt aber Risiken: Die Grenzen zwischen Berufs- und Privatleben verschwimmen zunehmend, was langfristig zu Burnout f\u00FChren kann. Unternehmen sind daher gefordert, klare Richtlinien f\u00FCr die Erreichbarkeit au\u00DFerhalb der Arbeitszeit einzuf\u00FChren."\n\nWas fordert der Text von Unternehmen?',
    ctx:null,
    opts:['Ein Verbot von Homeoffice','Mehr Homeoffice f\u00FCr alle','Klare Regeln zum Schutz der Freizeit','Bessere technische Ausstattung'],
    ans:2,
    expl:'The text calls for companies to introduce clear guidelines on availability outside working hours -- protecting employees private time.'
  },
  {
    cat:'Leseverstehen',
    q:'Was bedeutet "die Grenzen verschwimmen" im obigen Text?',
    ctx:'Bezug auf den Homeoffice-Text.',
    opts:['Die Grenzen werden klarer','Die Unterschiede werden undeutlicher','Die Regeln werden strenger','Die Arbeitszeiten werden l\u00E4nger'],
    ans:1,
    expl:'\'Verschwimmen\' = to blur/become indistinct. The boundary between work and private life becomes unclear. A typical B2 vocabulary-in-context question.'
  },
  {
    cat:'Leseverstehen',
    q:'Welche Schlussfolgerung passt?\n\n"Trotz der hohen Kosten entschieden sich 78% der Befragten f\u00FCr das umweltfreundlichere Produkt."',
    ctx:null,
    opts:['Preis ist der wichtigste Kaufentscheidungsfaktor.','Die meisten Befragten stellten Umweltschutz \u00FCber den Preis.','Das Produkt war g\u00FCnstiger als erwartet.','Die Befragten hatten kein Interesse an Umweltthemen.'],
    ans:1,
    expl:'\'Trotz der hohen Kosten\' (despite high cost) + 78% chose it = majority prioritised eco-friendliness over price. Tests inference from concessive structures.'
  },
  {
    cat:'Redemittel',
    q:'Sie m\u00F6chten eine Meinung abschw\u00E4chen und Offenheit zeigen. Welcher Ausdruck passt?',
    ctx:null,
    opts:['Das steht v\u00F6llig au\u00DFer Frage.','Man k\u00F6nnte durchaus argumentieren, dass ... obwohl ...','Ich behaupte ohne Zweifel, dass ...','Niemand kann anderer Meinung sein.'],
    ans:1,
    expl:'\'Man k\u00F6nnte durchaus argumentieren, dass ... obwohl ...\' hedges a claim and signals openness to counterarguments -- a mark of B2+ discourse.'
  },
  {
    cat:'Redemittel',
    q:'Welcher Ausdruck leitet eine Schlussfolgerung in einem formellen Text ein?',
    ctx:null,
    opts:['Ach ja, und au\u00DFerdem ...','Na ja, irgendwie ...','Daraus l\u00E4sst sich schlie\u00DFen, dass ...','Und dann war da noch ...'],
    ans:2,
    expl:'\'Daraus l\u00E4sst sich schlie\u00DFen, dass ...\' is a standard formal connector for conclusions -- essential for B2 Schreiben and Sprechen. The others are informal fillers.'
  },
  {
    cat:'Redemittel',
    q:'Sie antworten auf Kritik in einer formellen Diskussion. Was ist am angemessensten?',
    ctx:null,
    opts:['Das stimmt \u00FCberhaupt nicht!','Ich sehe das anders, nehme Ihren Einwand aber zur Kenntnis.','Keine Ahnung, was Sie meinen.','Da haben Sie leider keine Ahnung.'],
    ans:1,
    expl:'\'Ich sehe das anders, nehme Ihren Einwand aber zur Kenntnis\' disagrees while acknowledging the other\'s point respectfully -- the required register for formal B2 discussions.'
  }
];

var questions = [], current = 0, score = 0, results = [], answered = false;

function shuffle(a) {
  var arr = a.slice(), i, j, t;
  for (i = arr.length - 1; i > 0; i--) {
    j = Math.floor(Math.random() * (i + 1));
    t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}

function showScreen(id) {
  var all = document.querySelectorAll('.screen'), i;
  for (i = 0; i < all.length; i++) all[i].classList.remove('active');
  document.getElementById(id).classList.add('active');
}

function startQuiz() {
  questions = shuffle(QS);
  current = 0; score = 0; results = [];
  showScreen('s-quiz');
  renderQ();
}

function renderQ() {
  answered = false;
  var q = questions[current], total = questions.length, i;
  document.getElementById('pfill').style.width = Math.round((current / total) * 100) + '%';
  document.getElementById('qcnt').textContent = (current + 1) + ' / ' + total;
  var letters = ['A','B','C','D'];
  var optsHtml = '';
  for (i = 0; i < q.opts.length; i++) {
    optsHtml += '<button class="opt" data-idx="' + i + '"><span class="opt-l">' + letters[i] + '</span><span>' + q.opts[i] + '</span></button>';
  }
  var html = '<div class="fi"><div class="cbadge">' + q.cat + '</div>'
    + '<div class="qtext">' + q.q + '</div>'
    + (q.ctx ? '<div class="qctx">' + q.ctx + '</div>' : '')
    + '<div class="opts" id="opts">' + optsHtml + '</div>'
    + '<div class="expl" id="expl"><strong>Erkl\u00E4rung:</strong> ' + q.expl + '</div>'
    + '<button class="btn-n" id="bnext">' + (current < questions.length - 1 ? 'NEXT QUESTION' : 'SEE RESULTS') + '</button></div>';
  document.getElementById('qarea').innerHTML = html;
  var btns = document.getElementById('opts').querySelectorAll('.opt');
  for (i = 0; i < btns.length; i++) {
    (function(idx) {
      btns[idx].addEventListener('click', function() { selectAnswer(idx); });
    })(i);
  }
  document.getElementById('bnext').addEventListener('click', nextQ);
}

function selectAnswer(chosen) {
  if (answered) return;
  answered = true;
  var q = questions[current], correct = q.ans, isRight = (chosen === correct), i;
  if (isRight) score++;
  results.push({ cat: q.cat, qtext: q.q, correct: isRight });
  var btns = document.getElementById('opts').querySelectorAll('.opt');
  for (i = 0; i < btns.length; i++) {
    btns[i].disabled = true;
    if (i === correct) btns[i].classList.add('correct');
    else if (i === chosen && !isRight) btns[i].classList.add('wrong');
  }
  document.getElementById('expl').classList.add('show');
  document.getElementById('bnext').classList.add('show');
}

function nextQ() {
  current++;
  if (current >= questions.length) showResults();
  else renderQ();
}

function showResults() {
  showScreen('s-results');
  var total = questions.length, pct = score / total, v, d, i, c;
  document.getElementById('scbig').textContent = score + '/' + total;
  if (pct >= 0.8) { v = 'Strong B2 level'; d = 'Excellent -- nearly exam-ready. Run timed mock tests and polish weak categories.'; }
  else if (pct >= 0.6) { v = 'Solid B1-B2 boundary'; d = 'Good base, but gaps remain. Revisit the categories where you dropped points.'; }
  else if (pct >= 0.4) { v = 'B1 level -- keep working'; d = 'Foundations are there. Focus on Grammatik precision and Wortschatz depth.'; }
  else { v = 'Below B2 -- significant gaps'; d = 'Follow the 6-month plan. Start with grammar foundations and daily listening.'; }
  document.getElementById('vtext').textContent = v;
  document.getElementById('vdesc').textContent = d;
  var cats = ['Grammatik','Wortschatz','H\u00F6ren','Leseverstehen','Redemittel'], csHtml = '';
  for (i = 0; i < cats.length; i++) {
    c = cats[i];
    var cq = results.filter(function(r){ return r.cat === c; });
    var cs = cq.filter(function(r){ return r.correct; }).length;
    var cls = (cs === cq.length) ? 'p' : (cs === 0 ? 'f' : '');
    csHtml += '<div class="csi"><div class="csi-n">' + c + '</div><div class="csi-v ' + cls + '">' + cs + '/' + cq.length + '</div></div>';
  }
  document.getElementById('csg').innerHTML = csHtml;
  var bdHtml = '<div class="bdn-t">Question Breakdown</div>', r;
  for (i = 0; i < results.length; i++) {
    r = results[i];
    var qshort = r.qtext.split(String.fromCharCode(10))[0].substring(0, 52) + '...';
    bdHtml += '<div class="brow"><div class="bc">' + r.cat + '</div><div class="bq">' + qshort + '</div><div class="br ' + (r.correct ? 'ok' : 'no') + '">' + (r.correct ? 'OK' : 'X') + '</div></div>';
  }
  document.getElementById('bdn').innerHTML = bdHtml;
}

document.getElementById('startBtn').addEventListener('click', startQuiz);
document.getElementById('retryBtn').addEventListener('click', function(){ location.reload(); });
</script>
</body>
</html>
